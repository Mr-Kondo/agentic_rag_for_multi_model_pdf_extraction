[project]
name = "agentic-rag-for-multi-model-pdf-extraction"
version = "0.3.0"
description = "Ollama-powered multi-modal RAG system for PDF documents with quality validation - local inference"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "chromadb>=1.5.1",
    "grpcio!=1.78.1",
    "dspy-ai>=2.5.0",
    "langfuse>=3.14.4",
    "ollama>=0.4.0",
    "opencv-python>=4.8.0",
    "easyocr>=1.7.2",
    "pdfplumber>=0.11.9",
    "pillow>=12.1.1",
    "pydantic>=2.12.5",
    "pymupdf>=1.27.1",
    "pytesseract>=0.3.13",
    "pytest>=9.0.2",
    "python-dotenv>=1.2.1",
    "sentence-transformers>=5.2.3",
    "tiktoken>=0.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
]

[project.scripts]
agentic-rag = "app:main"
